# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false

# Use a shorter Gradle user home to avoid Windows MAX_PATH issues
org.gradle.user.home=C:/g

android.useAndroidX=true
android.enableJetifier=true

# Expo
# newArchEnabled removed - New Architecture is default in RN 0.82+

# Kotlin
kotlin.code.style=official
